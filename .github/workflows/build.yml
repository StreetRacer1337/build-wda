name: Build WebDriverAgent IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout WebDriverAgent
        uses: actions/checkout@v4
        with:
          repository: 'appium/WebDriverAgent'
          ref: 'master'

      - name: Build WebDriverAgentRunner
        run: |
          mkdir -p build
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./derivedData \
            CODE_SIGNING_ALLOWED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf

      - name: Package to Clean IPA
        run: |
          mkdir -p Payload
          cp -r ./derivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app Payload/
          # Удаляем все dSYM и ненужные отладочные файлы, на которых спотыкается Sideloadly
          find Payload -name "*.dSYM" -exec rm -rf {} + || true
          zip -r WebDriverAgentRunner.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-ipa
          path: WebDriverAgentRunner.ipa
